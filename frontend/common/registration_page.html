<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Join — AAAGym</title>
  <link rel="icon" href="../favicon.svg">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Sans:wght@400;600;700&family=Syne:wght@700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../css/app.css">
</head>
<body>
  <main class="auth-wrap">
    <form class="auth-card" id="register-form">
      <p class="kicker">Door one</p>
      <h1>Take a desk</h1>
      <p>Members browse the register. Owners publish a gym page.</p>
      <div class="role-switch">
        <button type="button" class="btn-ghost is-active" data-role="gym_user">Member</button>
        <button type="button" class="btn-ghost" data-role="gym_owner">Owner</button>
      </div>
      <label class="field">Full name<input id="name" required></label>
      <label class="field">Email<input id="email" type="email" required></label>
      <label class="field">Username<input id="username" required></label>
      <label class="field">Password (8+ characters)<input id="password" type="password" minlength="8" required></label>
      <div id="member-fields">
        <label class="field">Age<input id="age" type="number" min="10" max="100"></label>
        <div class="role-switch">
          <label><input type="radio" name="gender" value="male"> Male</label>
          <label><input type="radio" name="gender" value="female"> Female</label>
        </div>
      </div>
      <button class="btn" type="submit" style="width:100%">Create account</button>
      <p>Already listed? <a href="login.html">Enter</a></p>
    </form>
  </main>
  <script src="../js/config.js"></script>
  <script src="../js/api.js"></script>
  <script src="../js/auth.js"></script>
  <script src="../js/ui.js"></script>
  <script>
    AAAGym.mountChrome({ role: 'guest' });
    var role = new URLSearchParams(location.search).get('role') === 'owner' ? 'gym_owner' : 'gym_user';
    var memberFields = document.getElementById('member-fields');
    function syncRole() {
      memberFields.style.display = role === 'gym_user' ? 'block' : 'none';
      document.querySelectorAll('[data-role]').forEach(function (el) {
        el.classList.toggle('is-active', el.getAttribute('data-role') === role);
      });
    }
    document.querySelectorAll('[data-role]').forEach(function (btn) {
      btn.addEventListener('click', function () {
        role = btn.getAttribute('data-role');
        syncRole();
      });
    });
    syncRole();
    document.getElementById('register-form').addEventListener('submit', async function (event) {
      event.preventDefault();
      var payload = {
        name: document.getElementById('name').value.trim(),
        email: document.getElementById('email').value.trim(),
        username: document.getElementById('username').value.trim(),
        password: document.getElementById('password').value,
        role: role
      };
      if (role === 'gym_user') {
        var age = parseInt(document.getElementById('age').value, 10);
        if (age) payload.age = age;
        var gender = document.querySelector('input[name="gender"]:checked');
        if (gender) payload.gender = gender.value;
      }
      try {
        await AAAGym.request('/auth/register', { method: 'POST', body: JSON.stringify(payload) });
        AAAGym.toast('Account created. Enter with your role.', 'ok');
        setTimeout(function () { location.href = 'login.html'; }, 700);
      } catch (err) {
        AAAGym.toast(err.message || 'Registration failed', 'err');
      }
    });
  </script>
</body>
</html>
