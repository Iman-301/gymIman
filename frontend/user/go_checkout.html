<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Visits — AAAGym</title>
  <link rel="icon" href="../favicon.svg">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Sans:wght@400;600;700&family=Syne:wght@700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../css/app.css">
</head>
<body>
  <main class="page">
    <p class="kicker">Your list</p>
    <h1 class="display" style="font-size: clamp(2.4rem, 6vw, 4.4rem);">I will walk in</h1>
    <div class="visit-list" id="list"></div>
  </main>
  <script src="../js/config.js"></script>
  <script src="../js/api.js"></script>
  <script src="../js/auth.js"></script>
  <script src="../js/ui.js"></script>
  <script>
    AAAGym.requireRole('gym_user');
    AAAGym.mountChrome({ role: 'gym_user', active: 'visits' });
    var listEl = document.getElementById('list');

    async function load() {
      var ids = AAAGym.visitList();
      if (!ids.length) {
        listEl.innerHTML = '<div class="empty">Nothing pinned yet. Open a gym and add it to visits.</div>';
        return;
      }
      var gyms = await Promise.all(ids.map(function (id) {
        return AAAGym.request('/gym/' + id).catch(function () { return null; });
      }));
      gyms = gyms.filter(Boolean);
      if (!gyms.length) {
        listEl.innerHTML = '<div class="empty">Those gyms are no longer listed.</div>';
        return;
      }
      listEl.innerHTML = gyms.map(function (gym) {
        return '<article class="visit-item" data-id="' + gym.id + '">' +
          '<img src="' + AAAGym.imageUrl(gym.images && gym.images[0]) + '" alt="" onerror="this.src=\'' + AAAGym.fallbackImg + '\'">' +
          '<a class="grow" href="about_gym.html?id=' + gym.id + '"><h3>' + AAAGym.escape(gym.name) + '</h3><p>' + AAAGym.escape((gym.description || '').slice(0, 110)) + '</p></a>' +
          '<button class="btn btn-ghost" data-remove="' + gym.id + '">Remove</button></article>';
      }).join('');
      listEl.querySelectorAll('[data-remove]').forEach(function (btn) {
        btn.addEventListener('click', function () {
          AAAGym.toggleVisit(btn.getAttribute('data-remove'));
          load();
        });
      });
    }
    load();
  </script>
</body>
</html>
