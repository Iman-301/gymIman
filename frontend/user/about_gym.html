<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Gym — AAAGym</title>
  <link rel="icon" href="../favicon.svg">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Sans:wght@400;600;700&family=Syne:wght@700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../css/app.css">
</head>
<body>
  <main class="page" id="content">
    <div class="status">Opening the floor plan…</div>
  </main>
  <script src="../js/config.js"></script>
  <script src="../js/api.js"></script>
  <script src="../js/auth.js"></script>
  <script src="../js/ui.js"></script>
  <script>
    AAAGym.requireRole('gym_user');
    AAAGym.mountChrome({ role: 'gym_user', active: 'explore' });
    var id = new URLSearchParams(location.search).get('id');
    var content = document.getElementById('content');

    async function load() {
      if (!id) {
        content.innerHTML = '<div class="empty">Pick a gym from the catalog.</div>';
        return;
      }
      try {
        var gym = await AAAGym.request('/gym/' + id);
        document.title = gym.name + ' — AAAGym';
        var images = (gym.images || []).filter(Boolean).slice(0, 3);
        if (!images.length) images = [null, null, null];
        var gallery = '<div class="detail-gallery">' + images.map(function (img) {
          return '<img src="' + AAAGym.imageUrl(img) + '" alt="" onerror="this.src=\'' + AAAGym.fallbackImg + '\'">';
        }).join('') + '</div>';
        var services = (gym.services || []).map(function (item) {
          return '<div class="chip"><strong>' + AAAGym.escape(item.title) + '</strong><p>' + AAAGym.escape(item.description) + '</p></div>';
        }).join('') || '<p>Services will appear when the owner publishes them.</p>';
        var plans = (gym.pricingPlans || []).map(function (plan) {
          return '<div class="plan"><h3>' + AAAGym.escape(plan.name) + '</h3><p>' + AAAGym.escape(plan.price) + '</p><p>' + AAAGym.escape(plan.detail) + '</p></div>';
        }).join('');
        var faqs = (gym.FAQs || []).map(function (faq) {
          return '<div class="faq"><strong>' + AAAGym.escape(faq.question) + '</strong><p>' + AAAGym.escape(faq.answer) + '</p></div>';
        }).join('');
        var visiting = AAAGym.visitList().includes(Number(gym.id));
        content.innerHTML =
          '<section class="detail-hero"><p class="kicker">' + AAAGym.escape([gym.city, gym.location].filter(Boolean).join(' · ') || 'Open register') + '</p>' +
          '<h1 class="display">' + AAAGym.escape(gym.name) + '</h1>' +
          '<p class="lede">' + AAAGym.escape(gym.description || '') + '</p>' +
          (gym.phone ? '<p>Desk: ' + AAAGym.escape(gym.phone) + '</p>' : '') +
          '<div class="hero-actions"><button class="btn" id="visit-btn">' + (visiting ? 'Remove from visits' : 'Add to visits') + '</button>' +
          '<a class="btn btn-ghost" href="go_checkout.html">Open visit list</a></div></section>' +
          gallery +
          '<div class="split"><div><p class="kicker">Services</p><div class="chip-list">' + services + '</div></div>' +
          '<div><p class="kicker">Membership</p><div class="stack">' + (plans || '<p>Ask the desk.</p>') + '</div></div></div>' +
          (faqs ? '<p class="kicker" style="margin-top:28px">FAQs</p><div class="faq-list">' + faqs + '</div>' : '');
        document.getElementById('visit-btn').addEventListener('click', function () {
          var added = AAAGym.toggleVisit(gym.id);
          this.textContent = added ? 'Remove from visits' : 'Add to visits';
          AAAGym.toast(added ? 'Pinned to your visit list' : 'Removed from visits', 'ok');
        });
      } catch (err) {
        content.innerHTML = '<div class="empty">This gym is not on the register.</div>';
      }
    }
    load();
  </script>
</body>
</html>
