<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>website for gyms</title>
    <link rel="stylesheet" href="../css/user/gym_lst.css">   
    <link rel="stylesheet" href="https://use.fontawesome.com/releases/v5.8.2/css/all.css"/>
    <link rel="stylesheet " href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
</head>
<body>
    <header>
        <h2 class="head">PeakPowerForge</h2>
    </header>
    <main class="lst" id="gymsContainer">
        <!-- Gym cards will be dynamically loaded here -->
        <div style="text-align: center; padding: 20px;">
            <p>Loading gyms...</p>
        </div>
    </main>

    <script>
        // Fetch and display all gyms
        async function loadGyms() {
            try {
                const response = await fetch('http://localhost:3000/gym');
                if (!response.ok) {
                    throw new Error('Failed to fetch gyms');
                }
                const gyms = await response.json();
                
                const container = document.getElementById('gymsContainer');
                
                if (gyms.length === 0) {
                    container.innerHTML = '<div style="text-align: center; padding: 20px;"><p>No gyms available yet.</p></div>';
                    return;
                }
                
                container.innerHTML = gyms.map(gym => {
                    // Get the first image or use a default
                    // Images are stored as './images/gymImages/filename.jpg'
                    // We need to convert to 'http://localhost:3000/images/gymImages/filename.jpg'
                    let imageUrl = '../img/g1.jpg'; // default fallback
                    
                    if (gym.images && Array.isArray(gym.images) && gym.images.length > 0) {
                        // Filter out empty strings and null values
                        const validImages = gym.images.filter(img => img && img.trim() !== '');
                        
                        if (validImages.length > 0) {
                            const imagePath = validImages[0];
                            // Remove './' prefix if present and construct full URL
                            const cleanPath = imagePath.replace(/^\.\//, '').trim();
                            
                            // Only use backend image if path looks valid
                            if (cleanPath && cleanPath.startsWith('images/')) {
                                imageUrl = `http://localhost:3000/${cleanPath}`;
                                console.log(`✓ Gym: ${gym.name}, Using backend image: ${imageUrl}`);
                            } else {
                                console.log(`⚠ Gym: ${gym.name}, Invalid image path: ${imagePath}, using default`);
                            }
                        } else {
                            console.log(`⚠ Gym: ${gym.name}, Images array is empty, using default`);
                        }
                    } else {
                        console.log(`⚠ Gym: ${gym.name}, No images array or empty, using default`);
                    }
                    
                    return `
                        <div class="container">
                            <a href="about_gym.html?id=${gym.id}">
                                <img src="${imageUrl}" alt="${gym.name}" 
                                     onerror="console.error('Failed to load image for ${gym.name}:', '${imageUrl}'); this.src='../img/g1.jpg';">
                                <h3>${gym.name}</h3>
                            </a>
                        </div>
                    `;
                }).join('');
            } catch (error) {
                console.error('Error loading gyms:', error);
                document.getElementById('gymsContainer').innerHTML = 
                    '<div style="text-align: center; padding: 20px;"><p>Error loading gyms. Please try again later.</p></div>';
            }
        }
        
        // Load gyms when page loads
        document.addEventListener('DOMContentLoaded', loadGyms);
    </script>
    <footer>
        <a href="gym_lst.html"><i class="fa-solid fa-house"></i></a>
        <a href="about_gym.html"><i class="fa-solid fa-circle-info"></i></a>
        <a href="go_checkout.html"><i class="fa fa-map-marker" aria-hidden="true"></i></a>
        <a href="contact.html"><i class="fa-solid fa-address-book"></i></a>
        <a href="log_out.html"><i class="fa-solid fa-right-from-bracket"></i></a>

    </footer>

    
</body>
</html>
