<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Explore — AAAGym</title>
  <link rel="icon" href="../favicon.svg">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Sans:wght@400;600;700&family=Syne:wght@700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../css/app.css">
</head>
<body>
  <main class="page">
    <p class="kicker">The catalog</p>
    <h1 class="display" style="font-size: clamp(2.6rem, 7vw, 5rem);">Rooms on the register</h1>
    <div class="toolbar">
      <label class="search"><input id="q" placeholder="Search a name, city, or street"></label>
    </div>
    <section class="gym-grid" id="gyms"></section>
  </main>
  <script src="../js/config.js"></script>
  <script src="../js/api.js"></script>
  <script src="../js/auth.js"></script>
  <script src="../js/ui.js"></script>
  <script>
    AAAGym.requireRole('gym_user');
    AAAGym.mountChrome({ role: 'gym_user', active: 'explore' });
    var box = document.getElementById('gyms');
    var timer;
    async function load() {
      box.innerHTML = '<div class="status">Pulling the register…</div>';
      try {
        var q = document.getElementById('q').value.trim();
        var gyms = await AAAGym.request('/gym' + (q ? '?q=' + encodeURIComponent(q) : ''));
        if (!gyms.length) {
          box.innerHTML = '<div class="empty">Nothing listed yet. Ask an owner to publish a floor.</div>';
          return;
        }
        box.innerHTML = gyms.map(function (gym, index) {
          return '<a class="gym-card" href="about_gym.html?id=' + gym.id + '">' +
            '<img src="' + AAAGym.imageUrl(gym.images && gym.images[0]) + '" alt="' + AAAGym.escape(gym.name) + '" onerror="this.src=\'' + AAAGym.fallbackImg + '\'">' +
            '<div class="meta"><span>' + String(index + 1).padStart(2, '0') + '</span><span>' + AAAGym.escape(gym.city || 'Open floor') + '</span></div>' +
            '<h3>' + AAAGym.escape(gym.name) + '</h3></a>';
        }).join('');
      } catch (err) {
        box.innerHTML = '<div class="empty">Could not load gyms. Check the API connection.</div>';
      }
    }
    document.getElementById('q').addEventListener('input', function () {
      clearTimeout(timer);
      timer = setTimeout(load, 220);
    });
    load();
  </script>
</body>
</html>
