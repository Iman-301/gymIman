<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Owner account — AAAGym</title>
  <link rel="icon" href="../favicon.svg">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Sans:wght@400;600;700&family=Syne:wght@700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../css/app.css">
</head>
<body>
  <main class="page">
    <p class="kicker">Owner desk</p>
    <h1 class="display" id="hello" style="font-size: clamp(2.2rem, 6vw, 4rem);">Account</h1>
    <div class="account-grid">
      <div class="panel"><div><p class="kicker">Username</p><strong id="username">—</strong></div><button class="btn btn-ghost" data-edit="username">Change</button></div>
      <div class="panel"><div><p class="kicker">Email</p><strong id="email">—</strong></div><button class="btn btn-ghost" data-edit="email">Change</button></div>
      <div class="panel"><div><p class="kicker">Password</p><strong>••••••••</strong></div><button class="btn btn-ghost" data-edit="password">Change</button></div>
      <div class="panel"><div><p class="kicker">Session</p><span>Leave this device</span></div><button class="btn" id="logout">Log out</button></div>
      <div class="panel"><div><p class="kicker">Danger</p><span>This cannot be undone</span></div><button class="btn btn-danger" id="delete">Delete account</button></div>
    </div>
  </main>
  <script src="../js/config.js"></script>
  <script src="../js/api.js"></script>
  <script src="../js/auth.js"></script>
  <script src="../js/ui.js"></script>
  <script src="../js/account.js"></script>
</body>
</html>
