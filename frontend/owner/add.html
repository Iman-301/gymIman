<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Studio — AAAGym</title>
  <link rel="icon" href="../favicon.svg">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Sans:wght@400;600;700&family=Syne:wght@700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../css/app.css">
</head>
<body>
  <main class="page">
    <p class="kicker">Owner studio</p>
    <h1 class="display" style="font-size: clamp(2.4rem, 6vw, 4.6rem);" id="title">Publish the room</h1>
    <form id="studio-form">
      <div class="upload-grid">
        <label class="upload-box">Cover photo<input type="file" accept="image/*" id="cover"><img id="cover-preview" alt=""></label>
      </div>
      <label class="field">Gym name<input id="name" required></label>
      <div class="split">
        <label class="field">City<input id="city"></label>
        <label class="field">Street / area<input id="location"></label>
      </div>
      <label class="field">Phone<input id="phone"></label>
      <label class="field">Facilities and voice<textarea id="description" required placeholder="What does the room feel like at 6am?"></textarea></label>
      <p class="kicker">Services</p>
      <div class="repeater" id="services"></div>
      <button type="button" class="btn btn-ghost" data-add="services">Add service</button>
      <p class="kicker" style="margin-top:20px">Pricing</p>
      <div class="repeater" id="pricing"></div>
      <button type="button" class="btn btn-ghost" data-add="pricing">Add plan</button>
      <p class="kicker" style="margin-top:20px">FAQs</p>
      <div class="repeater" id="faqs"></div>
      <button type="button" class="btn btn-ghost" data-add="faqs">Add FAQ</button>
      <div class="hero-actions" style="margin-top:24px">
        <button class="btn" type="submit" id="save">Save gym</button>
        <button class="btn btn-danger" type="button" id="delete" hidden>Remove listing</button>
      </div>
    </form>
  </main>
  <script src="../js/config.js"></script>
  <script src="../js/api.js"></script>
  <script src="../js/auth.js"></script>
  <script src="../js/ui.js"></script>
  <script src="../js/studio.js"></script>
</body>
</html>
